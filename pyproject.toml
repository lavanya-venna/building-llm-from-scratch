[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch"
version = "0.1.1"
description = "Hindi LLM from scratch: data collection, cleaning, and tokenizer construction"
readme = "CLAUDE.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lavanya Venna"}
]

[project.urls]
Homepage = "https://github.com/lavanya-venna/building-llm-from-scratch"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["data*", "tokenizer*", "evaluation*", "utils*", "model*"]
exclude = ["*.tests", "*.tests.*", "tests.*", "tests"]
